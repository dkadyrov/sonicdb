[tool.ruff]
target-version = "py311"

[tool.ruff.lint]

[tool.hatch.envs.default]
python = "3.11"
dependencies = [ 
    "mypy", 
    "ruff", 
    "pytest", 
    "sphinx",
    "sphinx-click",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "furo",
    "myst-parser",
    "librosa",
    "pandas",
    "pydub",
    "matplotlib",
    "sqlalchemy",
    "sqlalchemy-utils",
    "sqlalchemy-migrate",
    "soundfile",
    "scipy"
] 

[tool.hatch.envs.default.scripts]
test = "pytest"
lint = [
    "ruff format .", 
    "ruff lint .",
    "mypy spidb/"
]
lint-check = [
  "ruff format --check .",
  "ruff .",
  "mypy spidb/"
]
docs-serve = "sphinx-autobuild docs/. docs/build"
docs-build-html = "sphinx-build -M html docs/. docs/build"
docs-build-latex = "sphinx-build -M latex docs/. docs/build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "sonicdb/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SONICDB"
version = "0.1.0"
description = "SONIC is a Python package that leverages relational databases to accommodate the storage and retrieval of audio files."
readme = "README.md"
license = "MIT"
keywords = []
authors = [
  { name = "daniel kadyrov", email = "daniel.kadyrov@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
  "librosa",
  "pandas",
  "pydub",
  "matplotlib",
  "sqlalchemy",
  "sqlalchemy-utils",
  "sqlalchemy-migrate",
  "soundfile",
  "scipy",
  "sphinx",
  "sphinx-click",
  "sphinx-autobuild",
  "sphinx-copybutton",
  "furo",
  "myst-parser"
]

[project.urls]
Documentation = "https://sonicdb.readthedocs.io/en/latest/"
Issues = "https://github.com/dkadyrov/sonicdb/issues"
Source = "https://github.com/dkadyrov/sonicdb"