name: Build Documentation

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Match the Python version in your Hatch config

    - name: Install Hatch
      run: pip install hatch

    - name: Install dependencies
      run: hatch env create  # Create and install dependencies in the Hatch environment

    - name: Build documentation
      run: hatch run docs-build-html  # Use the Hatch script to build the documentation